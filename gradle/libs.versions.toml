[versions]
node = "22.12.0"
junit = "5.12.2"

[libraries]
plugin-node = { group = "com.github.node-gradle", name = "gradle-node-plugin", version = "7.1.0" }
jinjava = { group = "com.hubspot.jinjava", name = "jinjava", version = "2.8.4" }
jackson-databind = { group = "com.fasterxml.jackson.core", name = "jackson-databind", version = "2.20.1" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
assertj = { group = "org.assertj", name = "assertj-core", version = "3.27.3" }